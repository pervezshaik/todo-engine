[project]
name = "todo-engine"
version = "0.1.0"
description = "Agentic to-do execution engine: runs each task in todo.md with an autonomous Claude agent"
requires-python = ">=3.10"
dependencies = [
    "claude-agent-sdk>=0.1.72",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "ruff>=0.8",
    "mypy>=1.13",
    "pre-commit>=4",
    "nox>=2024.4",
]

[project.scripts]
todo-engine = "todo_engine.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["todo_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Unit tests are deterministic and $0. Live tests hit the real engine:
#   pytest -m live
addopts = "-m 'not live'"
markers = [
    "live: exercises the real Claude engine (costs money, needs the Claude Code login)",
]

[tool.coverage.run]
source = ["todo_engine"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["todo_engine", "tests"]
extend-exclude = ["examples", "runs", "memory"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "UP",        # pyupgrade
    "B",         # bugbear
    "BLE",       # blind except (the code uses `# noqa: BLE001` deliberately)
    "C4",        # comprehensions
    "SIM",       # simplify
    "PT",        # pytest style
    "RUF",       # ruff-specific
]
ignore = [
    "RUF001", "RUF002", "RUF003",  # em dashes / typographic chars in strings & comments are intended
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "PT011",  # broad pytest.raises is fine in tests
    "PT018",  # compound asserts read fine in tests
]

[tool.ruff.lint.isort]
known-first-party = ["todo_engine", "fakes"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["todo_engine"]
warn_unreachable = true
show_error_codes = true
pretty = true
