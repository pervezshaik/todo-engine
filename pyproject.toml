[project]
name = "todo-engine"
version = "0.1.0"
description = "Agentic to-do execution engine: runs each task in todo.md with an autonomous Claude agent"
requires-python = ">=3.10"
dependencies = [
    "claude-agent-sdk>=0.1.72",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
]

[project.scripts]
todo-engine = "todo_engine.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["todo_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Unit tests are deterministic and $0. Live tests hit the real engine:
#   pytest -m live
addopts = "-m 'not live'"
markers = [
    "live: exercises the real Claude engine (costs money, needs the Claude Code login)",
]

[tool.coverage.run]
source = ["todo_engine"]

[tool.coverage.report]
show_missing = true
skip_covered = false
